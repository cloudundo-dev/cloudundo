name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Fuzz briefly
        run: |
          go test -run='^$' -fuzz=FuzzAnalyze -fuzztime=30s ./internal/effects
          go test -run='^$' -fuzz=FuzzHookInput -fuzztime=30s ./cmd/cloudundo
      - name: Build for every platform
        run: make release VERSION=ci
